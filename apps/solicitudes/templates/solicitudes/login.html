{% extends 'solicitudes/fragments/base.html' %}
{% block main-content %}

    <div class="center-align">
        <i class="material-icons large teal-text text-darken-2">event_available</i>
        <h4>Iniciar sesión</h4>
    </div>

    <div class="row">
        <div class="col s8 offset-s2">

            {% if message %}
                <div class="card-panel red darken-1">
                  <span class="white-text">
                      {{ message }}
                  </span>
                </div>
            {% endif %}

            {% include 'solicitudes/fragments/forms.html' with boton='Entrar' %}

        </div>
    </div>
{% endblock %}
