{% extends 'solicitudes/fragments/base.html' %}
{% block main-content %}
    <div class="row">
        <div class="col s8 offset-s2">
            <div class="card">
                <div class="card-content">
                    <span class="card-title">Cancelar solicitud</span>
                    <p>¿Seguro que quieres cancelar la solicitud <b>{{ solicitud }}</b>?</p>
                    <p>Esta acción no se puede deshacer.</p>
                </div>
                <div class="card-action">
                    <form method="post">
                        {% csrf_token %}
                        <a class="btn grey" href="{% url 'solicitudes:home' %}">No, volver</a>
                        <button class="btn red lighten-1" type="submit">Sí, cancelar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
