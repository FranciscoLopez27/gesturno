<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GesTurno</title>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/css/materialize.min.css">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

    <style>
        .errorlist {
            color: #F44336 !important;
        }

        /* Fondo gris claro para que las tarjetas y tablas resalten */
        body {
            background-color: #f5f5f5;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        main {
            flex: 1 0 auto;
        }
    </style>
</head>
<body>
<nav class="teal darken-2" role="navigation">
    <div class="nav-wrapper container">
        <a id="logo-container" href="{% url 'solicitudes:home' %}" class="brand-logo">GesTurno</a>
        {% if request.user.is_authenticated %}
            <ul class="right hide-on-med-and-down">
                <li><a href="{% url 'solicitudes:home' %}">Mis solicitudes</a></li>
                <li><a href="{% url 'solicitudes:mis-turnos' %}">Mis turnos</a></li>
                <li><a href="{% url 'solicitudes:tipos-lista' %}">Tipos de solicitud</a></li>
                <li><a href="{% url 'solicitudes:log-out' %}">Salir ({{ request.user.username }})</a></li>
            </ul>
            <ul id="nav-mobile" class="side-nav">
                <li><a href="{% url 'solicitudes:home' %}">Mis solicitudes</a></li>
                <li><a href="{% url 'solicitudes:mis-turnos' %}">Mis turnos</a></li>
                <li><a href="{% url 'solicitudes:tipos-lista' %}">Tipos de solicitud</a></li>
                <li><a href="{% url 'solicitudes:log-out' %}">Salir</a></li>
            </ul>
            <a href="#" data-activates="nav-mobile" class="button-collapse"><i class="material-icons">menu</i></a>
        {% endif %}
    </div>
</nav>
<main>
    <div class="container">
        <div class="section">
            {% block main-content %}{% endblock %}
        </div>
        <br><br>
    </div>
</main>

<footer class="page-footer teal darken-2"></footer>

<script type="text/javascript" src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
<!-- Compiled and minified JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/0.100.2/js/materialize.min.js"></script>

<script>
    $(document).ready(function () {
        $('select').material_select();

         $('.datepicker').pickadate({
            selectMonths: true, // Creates a dropdown to control month
            selectYears: 15, // Creates a dropdown of 15 years to control year,
            today: 'Today',
            clear: 'Clear',
            close: 'Ok',
            closeOnSelect: false // Close upon selecting a date,
          });
    });
</script>

</body>
</html>
